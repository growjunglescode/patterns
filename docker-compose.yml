services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: patterns
      POSTGRES_PASSWORD: patterns
      POSTGRES_DB: patterns
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patterns"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://patterns:patterns@postgres:5432/patterns
      SECRET_KEY: local-dev-only-change-me
      MEDIA_ROOT: /data/media
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - media:/data/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  media:
